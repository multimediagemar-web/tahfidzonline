<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Setoran Hafalan - Admin Panel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#0ea5e9', // Sky blue 500 for Admin distinction
                        secondary: '#0369a1', // Sky blue 700
                    }
                }
            }
        }
    </script>
    <style>
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans min-h-screen">

    <!-- Navbar -->
    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-4 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <i class="fas fa-shield-alt text-2xl text-primary"></i>
                <h1 class="text-xl font-bold">Admin Hafalan</h1>
            </div>
            
            <!-- Navigation Tabs -->
            <div class="flex gap-2 overflow-x-auto w-full md:w-auto pb-2 md:pb-0 hide-scrollbar">
                <button onclick="switchTab('review')" id="nav-review" class="whitespace-nowrap px-4 py-2 rounded-lg bg-primary font-medium transition text-sm">Review Setoran</button>
                <button onclick="switchTab('jadwal')" id="nav-jadwal" class="whitespace-nowrap px-4 py-2 rounded-lg hover:bg-slate-800 font-medium transition text-sm">Kelola Jadwal</button>
                <button onclick="switchTab('video')" id="nav-video" class="whitespace-nowrap px-4 py-2 rounded-lg hover:bg-slate-800 font-medium transition text-sm">Kelola Kajian</button>
            </div>
        </div>
    </header>

    <main class="container mx-auto px-4 py-8 max-w-5xl">

        <!-- Tab: Review Setoran -->
        <section id="tab-review" class="block animate-fade-in">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-800">Daftar Setoran Masuk</h2>
                <button onclick="loadSetoran()" class="text-primary hover:text-secondary"><i class="fas fa-sync-alt"></i> Refresh</button>
            </div>
            
            <div id="admin-setoran-container" class="grid gap-4">
                <!-- Data setoran dimuat via JS -->
            </div>
        </section>

        <!-- Tab: Kelola Jadwal -->
        <section id="tab-jadwal" class="hidden animate-fade-in">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Kelola Jadwal Zoom</h2>
            
            <!-- Form Tambah Jadwal -->
            <div class="bg-white p-6 rounded-xl shadow-sm border mb-8">
                <h3 class="font-bold mb-4 text-lg border-b pb-2">Tambah Jadwal Baru</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Judul Agenda</label>
                        <input type="text" id="j-judul" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: Bimbingan Tajwid">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Tipe</label>
                        <select id="j-tipe" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                            <option value="Bimbingan">Bimbingan Hafalan</option>
                            <option value="Kajian">Kajian Umum</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Tanggal</label>
                        <input type="date" id="j-tanggal" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">Waktu (WIB)</label>
                        <input type="time" id="j-waktu" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none">
                    </div>
                    <div class="md:col-span-2">
                        <label class="block text-sm font-medium mb-1">Link Zoom</label>
                        <input type="url" id="j-link" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="https://zoom.us/...">
                    </div>
                </div>
                <button onclick="addJadwal()" class="mt-4 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-6 rounded-lg transition">
                    <i class="fas fa-plus mr-1"></i> Simpan Jadwal
                </button>
            </div>

            <!-- List Jadwal -->
            <div id="admin-jadwal-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Data jadwal dimuat via JS -->
            </div>
        </section>

        <!-- Tab: Kelola Video Kajian -->
        <section id="tab-video" class="hidden animate-fade-in">
            <h2 class="text-2xl font-bold mb-6 text-slate-800">Kelola Video Kajian</h2>
            
            <!-- Form Tambah Video -->
            <div class="bg-white p-6 rounded-xl shadow-sm border mb-8">
                <h3 class="font-bold mb-4 text-lg border-b pb-2">Tambah Video (YouTube)</h3>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium mb-1">Judul Video</label>
                        <input type="text" id="v-judul" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: Kajian Tematik">
                    </div>
                    <div>
                        <label class="block text-sm font-medium mb-1">URL Embed YouTube</label>
                        <input type="url" id="v-url" class="w-full border px-3 py-2 rounded-lg focus:ring-2 focus:ring-primary outline-none" placeholder="Cth: https://www.youtube.com/embed/xyz">
                        <p class="text-xs text-gray-500 mt-1">Pastikan menggunakan link format /embed/</p>
                    </div>
                </div>
                <button onclick="addVideo()" class="mt-4 bg-slate-900 hover:bg-slate-800 text-white font-medium py-2 px-6 rounded-lg transition">
                    <i class="fas fa-plus mr-1"></i> Tambah Video
                </button>
            </div>

            <!-- List Video -->
            <div id="admin-video-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                <!-- Data video dimuat via JS -->
            </div>
        </section>

    </main>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-4 right-4 bg-green-500 text-white px-6 py-3 rounded-lg shadow-lg transform transition-transform duration-300 translate-y-24 z-50">
        <span id="toast-message">Notifikasi</span>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, setDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'app-hafalan-123';
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUser = null;
        let state = { setoran: [], schedules: [], videos: [] };

        // Autentikasi terlebih dahulu
        const initAuth = async () => {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.error("Auth error", e);
                window.showToast("Gagal terhubung ke database", "error");
            }
        };

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user) setupListeners();
        });

        initAuth();

        // Mengambil data secara real-time
        function setupListeners() {
            if (!currentUser) return;
            
            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'setoran'), (snap) => {
                state.setoran = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-review').classList.contains('block')) renderSetoran();
            }, (e) => console.error(e));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'schedules'), (snap) => {
                state.schedules = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-jadwal').classList.contains('block')) renderJadwal();
            }, (e) => console.error(e));

            onSnapshot(collection(db, 'artifacts', appId, 'public', 'data', 'videos'), (snap) => {
                state.videos = snap.docs.map(d => ({id: d.id, ...d.data()}));
                if(document.getElementById('tab-video').classList.contains('block')) renderVideo();
            }, (e) => console.error(e));
        }

        // --- Navigasi & Fungsionalitas UI ---
        window.switchTab = function(tabId) {
            document.querySelectorAll('section').forEach(sec => {
                sec.classList.remove('block');
                sec.classList.add('hidden');
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tab-${tabId}`).classList.add('block');

            const navs = ['review', 'jadwal', 'video'];
            navs.forEach(nav => {
                const el = document.getElementById(`nav-${nav}`);
                if(nav === tabId) {
                    el.classList.add('bg-primary'); el.classList.remove('hover:bg-slate-800');
                } else {
                    el.classList.remove('bg-primary'); el.classList.add('hover:bg-slate-800');
                }
            });

            if(tabId === 'review') renderSetoran();
            if(tabId === 'jadwal') renderJadwal();
            if(tabId === 'video') renderVideo();
        };

        window.loadSetoran = function() { renderSetoran(); };

        // --- Render Data & Aksi Firebase ---
        function renderSetoran() {
            const container = document.getElementById('admin-setoran-container');
            const sortedSetoran = [...state.setoran].sort((a,b) => Number(b.id) - Number(a.id));

            if(sortedSetoran.length === 0) {
                container.innerHTML = `<div class="p-8 text-center bg-white rounded-xl shadow-sm border text-gray-500">Belum ada setoran masuk.</div>`;
                return;
            }

            container.innerHTML = sortedSetoran.map(s => `
                <div class="bg-white p-5 rounded-xl shadow-sm border flex flex-col md:flex-row gap-4 items-start md:items-center justify-between">
                    <div class="flex-1">
                        <div class="flex items-center gap-2 mb-1">
                            <h3 class="font-bold text-lg text-slate-800">${s.user}</h3>
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold text-white
                                ${s.status === 'Menunggu Review' ? 'bg-yellow-500' : 
                                  s.status === 'Diterima' ? 'bg-green-500' : 'bg-red-500'}">
                                ${s.status}
                            </span>
                        </div>
                        <p class="text-slate-600 font-medium">${s.surah}</p>
                        <p class="text-xs text-slate-400 mt-1"><i class="far fa-clock"></i> Dikirim: ${s.date}</p>
                    </div>
                    
                    <div class="w-full md:w-auto flex flex-col sm:flex-row gap-3 items-center">
                        <audio src="${s.audioBase64}" controls class="w-full sm:w-64 h-10"></audio>
                        
                        ${s.status === 'Menunggu Review' ? `
                            <div class="flex gap-2 w-full sm:w-auto">
                                <button onclick="updateSetoranStatus('${s.id}', 'Diterima')" class="flex-1 bg-green-500 hover:bg-green-600 text-white px-3 py-2 rounded shadow transition text-sm font-medium">
                                    <i class="fas fa-check"></i> Terima
                                </button>
                                <button onclick="updateSetoranStatus('${s.id}', 'Perlu Perbaikan')" class="flex-1 bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded shadow transition text-sm font-medium">
                                    <i class="fas fa-times"></i> Tolak
                                </button>
                            </div>
                        ` : `
                            <button onclick="deleteSetoran('${s.id}')" class="text-red-500 hover:bg-red-50 px-3 py-2 rounded transition text-sm font-medium border border-red-200">
                                <i class="fas fa-trash"></i> Hapus
                            </button>
                        `}
                    </div>
                </div>
            `).join('');
        }

        window.updateSetoranStatus = async function(id, newStatus) {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'setoran', id), { status: newStatus }, { merge: true });
                window.showToast(`Status diubah menjadi: ${newStatus}`);
            } catch (e) {
                window.showToast("Gagal mengubah status", "error");
            }
        };

        window.deleteSetoran = async function(id) {
            if (!currentUser) return;
            if(confirm("Yakin ingin menghapus rekaman ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'setoran', id));
                    window.showToast("Setoran dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        function renderJadwal() {
            const container = document.getElementById('admin-jadwal-container');
            if(state.schedules.length === 0) {
                container.innerHTML = `<div class="col-span-full p-6 text-center bg-white border rounded-xl text-gray-500">Jadwal masih kosong.</div>`;
                return;
            }
            container.innerHTML = state.schedules.map(j => `
                <div class="bg-white p-4 rounded-xl shadow-sm border relative group">
                    <button onclick="deleteJadwal('${j.id}')" class="absolute top-3 right-3 text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-trash"></i>
                    </button>
                    <span class="text-xs font-bold text-slate-500 mb-1 block">${j.type}</span>
                    <h4 class="font-bold text-lg mb-2 pr-8">${j.title}</h4>
                    <p class="text-sm text-slate-600"><i class="far fa-calendar-alt w-5"></i> ${j.date}</p>
                    <p class="text-sm text-slate-600"><i class="far fa-clock w-5"></i> ${j.time} WIB</p>
                    <p class="text-sm text-blue-500 mt-2 truncate"><i class="fas fa-link w-5"></i> ${j.link}</p>
                </div>
            `).join('');
        }

        window.addJadwal = async function() {
            if (!currentUser) return;
            const title = document.getElementById('j-judul').value;
            const type = document.getElementById('j-tipe').value;
            const date = document.getElementById('j-tanggal').value;
            const time = document.getElementById('j-waktu').value;
            const link = document.getElementById('j-link').value;

            if(!title || !date || !time || !link) return window.showToast("Harap isi semua kolom jadwal!", "error");

            try {
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id), { title, type, date, time, link });
                
                document.getElementById('j-judul').value = '';
                document.getElementById('j-tanggal').value = '';
                document.getElementById('j-waktu').value = '';
                document.getElementById('j-link').value = '';
                window.showToast("Jadwal berhasil ditambahkan");
            } catch (e) {
                window.showToast("Gagal menyimpan jadwal", "error");
            }
        };

        window.deleteJadwal = async function(id) {
            if (!currentUser) return;
            if(confirm("Hapus jadwal ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'schedules', id));
                    window.showToast("Jadwal dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        function renderVideo() {
            const container = document.getElementById('admin-video-container');
            if(state.videos.length === 0) {
                container.innerHTML = `<div class="col-span-full p-6 text-center bg-white border rounded-xl text-gray-500">Video kajian masih kosong.</div>`;
                return;
            }
            container.innerHTML = state.videos.map(v => `
                <div class="bg-white rounded-xl overflow-hidden shadow-sm border">
                    <iframe class="w-full aspect-video" src="${v.url}" frameborder="0" allowfullscreen></iframe>
                    <div class="p-3 flex justify-between items-start gap-2">
                        <h4 class="font-bold text-sm line-clamp-2">${v.title}</h4>
                        <button onclick="deleteVideo('${v.id}')" class="text-red-500 hover:text-red-700 bg-red-50 p-2 rounded-lg transition shrink-0">
                            <i class="fas fa-trash text-sm"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        window.addVideo = async function() {
            if (!currentUser) return;
            const title = document.getElementById('v-judul').value;
            const url = document.getElementById('v-url').value;

            if(!title || !url) return window.showToast("Harap isi judul dan URL video!", "error");
            if(!url.includes('embed')) return window.showToast("Gunakan URL YouTube format embed!", "error");

            try {
                const id = Date.now().toString();
                await setDoc(doc(db, 'artifacts', appId, 'public', 'data', 'videos', id), { title, url });
                document.getElementById('v-judul').value = '';
                document.getElementById('v-url').value = '';
                window.showToast("Video berhasil ditambahkan");
            } catch (e) {
                window.showToast("Gagal menyimpan video", "error");
            }
        };

        window.deleteVideo = async function(id) {
            if (!currentUser) return;
            if(confirm("Hapus video ini?")) {
                try {
                    await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'videos', id));
                    window.showToast("Video dihapus");
                } catch (e) {
                    window.showToast("Gagal menghapus", "error");
                }
            }
        };

        window.showToast = function(msg, type="success") {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').innerText = msg;
            
            if(type === "error") {
                toast.classList.replace('bg-green-500', 'bg-red-500');
            } else {
                toast.classList.replace('bg-red-500', 'bg-green-500');
            }

            toast.classList.remove('translate-y-24');
            setTimeout(() => toast.classList.add('translate-y-24'), 3000);
        };
    </script>
</body>
</html>
